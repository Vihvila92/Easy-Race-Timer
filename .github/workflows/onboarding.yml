# Runs the CONTRIBUTING quick start on Ubuntu, Windows and macOS.
# Pull requests that touch docs, the toolchain or workflow files, and a weekly run on the default branch.
# The dev container job runs on that weekly schedule and when .devcontainer changes.
name: Onboarding

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "CONTRIBUTING.md"
      - "README.md"
      - "README.fi.md"
      - "CLA.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "docs/**"
      - "packages/**/README.md"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "rust-toolchain.toml"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/pull_request_template.md"
      - ".gitattributes"
      - ".githooks/**"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-start:
    name: quick-start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      LEAN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm test
      - run: pnpm check:lean

  devcontainer:
    name: devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${BASE_REF}...HEAD" -- .devcontainer | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the dev container and run tests
        if: steps.scope.outputs.run == 'true'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: pnpm test
