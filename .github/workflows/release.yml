# Builds unsigned Tauri installers for a dry run (workflow_dispatch) and
# publishes a GitHub Release for a pushed v* tag.
#
# Rust 1.90.0 is Tauri 2.12's minimum and is above the 1.89 floor.
# macOS ad-hoc signing is signingIdentity "-" in src-tauri/tauri.conf.json.
# Updater artifacts (createUpdaterArtifacts, latest.json, .sig) are produced
# only when TAURI_SIGNING_PRIVATE_KEY is set and a matching pubkey is available
# from plugins.updater.pubkey or TAURI_SIGNING_PUBLIC_KEY. A dry run does not
# need those secrets and does not create a release.
name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  installers:
    name: installers (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ""
          - platform: macos
            os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.90.0"
      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      # The desktop bundle only builds the web UI. better-sqlite3 is the Node
      # server's native module and has no Visual Studio toolchain on this job.
      - name: Install JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          overlay="${RUNNER_TEMP}/tauri-overlay.json"
          pnpm exec tsx scripts/release-assets.ts overlay --out "$overlay"
          args=(build --bundles "${{ matrix.bundles }}" --config "$overlay")
          if [[ -n "${{ matrix.target }}" ]]; then
            args+=(--target "${{ matrix.target }}")
          fi
          pnpm exec tauri "${args[@]}"
      - name: Collect installers
        run: pnpm exec tsx scripts/release-assets.ts collect --target src-tauri/target --dest dist --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.90.0"
      - name: CycloneDX SBOM from the pnpm lockfile
        run: |
          set -euo pipefail
          mkdir -p sbom
          pnpm dlx @cyclonedx/cdxgen@12.8.6 -t pnpm -o sbom/sbom-npm.cdx.json --spec-version 1.6 --no-install-deps --author "Easy Race Timer contributors" .
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const bom=JSON.parse(readFileSync('sbom/sbom-npm.cdx.json','utf8')); if (bom.bomFormat!=='CycloneDX') process.exit(1)"
      - name: CycloneDX SBOM from Cargo.lock
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --override-filename sbom-cargo --spec-version 1.5
          if [[ -f src-tauri/sbom-cargo.cdx.json ]]; then
            mv src-tauri/sbom-cargo.cdx.json sbom/sbom-cargo.cdx.json
          elif [[ -f src-tauri/sbom-cargo.json ]]; then
            mv src-tauri/sbom-cargo.json sbom/sbom-cargo.cdx.json
          else
            echo "cargo-cyclonedx did not write an SBOM" >&2
            exit 1
          fi
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const bom=JSON.parse(readFileSync('sbom/sbom-cargo.cdx.json','utf8')); if (bom.bomFormat!=='CycloneDX') process.exit(1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  bundle:
    name: bundle
    needs: [installers, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "*"
          path: release
          merge-multiple: true
      - name: Write latest.json and checksums
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release-assets.ts latest --dir release
          pnpm exec tsx scripts/release-assets.ts checksums --dir release
          args=(scripts/release-assets.ts assert --dir release)
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            args+=(--updater)
          fi
          pnpm exec tsx "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  publish:
    name: publish
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.msi
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/checksums.txt
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/sbom-npm.cdx.json
          sbom-path: release/sbom-npm.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/sbom-cargo.cdx.json
          sbom-path: release/sbom-cargo.cdx.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          Easy Race Timer ${version}

          The installers are not notarized and do not use a paid Windows code-signing certificate.
          On macOS, if Gatekeeper blocks the app, right-click it and choose Open.
          On Windows, if SmartScreen appears, choose More info, then Run anyway.

          Verify the download:

              gh release download ${GITHUB_REF_NAME} --repo Vihvila92/Easy-Race-Timer
              sha256sum -c checksums.txt
              gh attestation verify FILE --repo Vihvila92/Easy-Race-Timer

          See docs/release.md in the repository.
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Easy Race Timer ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi

  verify:
    name: verify
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
      - name: Check checksums
        run: |
          cd assets
          sha256sum -c checksums.txt
      - name: Verify installer attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for asset in assets/*.msi assets/*.exe assets/*.dmg assets/*.AppImage assets/*.deb; do
            found=1
            ok=0
            for _attempt in 1 2 3 4 5 6; do
              if gh attestation verify "$asset" --repo Vihvila92/Easy-Race-Timer; then
                ok=1
                break
              fi
              sleep 15
            done
            if [[ "$ok" != 1 ]]; then
              echo "Attestation check failed for $asset" >&2
              exit 1
            fi
          done
          if [[ "$found" != 1 ]]; then
            echo "No installers were downloaded" >&2
            exit 1
          fi
