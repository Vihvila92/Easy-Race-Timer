# CLA Assistant Lite — collects Contributor License Agreement signatures.
# SECURITY: runs on pull_request_target; it MUST NOT check out or execute PR code.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write        # re-run the CLA workflow on PRs after a signature comment
      contents: write       # commit signatures to the cla-signatures branch
      pull-requests: write  # post/update the CLA comment and lock PR after merge
      statuses: write       # set the CLA commit status on the PR head commit
    steps:
      - name: CLA Assistant
        # NOTE: the sign sentence must match CLA.md and the `if:` above.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: Vihvila92,dependabot[bot],github-actions[bot],cursoragent
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge this PR, please sign our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            by posting the sentence below as a separate comment.
          custom-allsigned-prcomment: All contributors have signed the CLA. ✅
          signed-commit-message: "chore(cla): $contributorName signed the CLA in $owner/$repo#$pullRequestNo"
          create-file-commit-message: "chore(cla): create CLA signatures file"
          lock-pullrequest-aftermerge: true
