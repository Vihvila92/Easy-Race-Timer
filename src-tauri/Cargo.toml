[package]
name = "easy-race-timer"
version = "0.1.0"
description = "Easy Race Timer desktop app"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "easy_race_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
# tauri::generate_context! names serde_json when plugins are set in tauri.conf.json.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[lints.clippy]
# Allow by default in clippy. -D warnings in CI turns this into an error.
cognitive_complexity = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
